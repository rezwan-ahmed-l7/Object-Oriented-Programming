name: C++ Repository Audit

on:
  pull_request:
    branches: [main]
    paths:
      - '**.cpp'
      - '.github/workflows/audit-cpp.yml'
  push:
    branches: [main]
    paths:
      - '**.cpp'
      - '.github/workflows/audit-cpp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Compile every C++ source and smoke-test runnable binaries
        shell: bash
        run: |
          mkdir -p /tmp/cpp-audit/bin
          : > /tmp/cpp-audit/results.tsv
          total=0
          compiled=0
          compile_failed=0
          ran=0
          runtime_nonzero=0
          timed_out=0
          sample_passed=0
          sample_failed=0

          while IFS= read -r -d '' file; do
            total=$((total + 1))
            safe_name=$(printf '%s' "$file" | sha256sum | cut -c1-16)
            binary="/tmp/cpp-audit/bin/$safe_name"

            if g++ -std=c++17 -Wall -Wextra -pedantic "$file" -o "$binary" 2>"/tmp/cpp-audit/$safe_name.compile.log"; then
              compiled=$((compiled + 1))
              set +e
              timeout 3s "$binary" </dev/null >"/tmp/cpp-audit/$safe_name.run.log" 2>&1
              code=$?
              set -e

              # Run small deterministic sample tests for selected input-driven examples.
              sample_input=""
              expected_one=""
              expected_two=""
              case "$file" in
                "./All C++ Codes/01_Employee_Salary.cpp"|"./All C++ Codes/02_Grocery_Salary.cpp"|"./C++ Codes/Salary.cpp")
                  sample_input="2 101 Ali 30000 102 Bob 50000"
                  expected_one="Name: Bob"
                  expected_two="Gross Salary: 65000.00"
                  ;;
                "./All C++ Codes/02_Complex_Number_Class.cpp")
                  sample_input="3 4 1 -2"
                  expected_one="Sum: 4 + 2i"
                  expected_two="Difference: 2 + 6i"
                  ;;
                "./C++ Codes/Bank_System.cpp")
                  sample_input=" "
                  expected_one="Balance: 8500"
                  expected_two="Total Savings: 9850"
                  ;;
                "./C++ Codes/Assaignment_2.cpp")
                  sample_input=" "
                  expected_one="Account holder's name: Paris"
                  expected_two="Balance: 5000"
                  ;;
                "./C++ Codes/Grocery_Salary.cpp")
                  sample_input="2 101 Ali 30000 102 Bob 50000"
                  expected_one="Name: Bob"
                  expected_two="Gross Salary: 65000.00"
                  ;;
                "./C++ Codes/Complex_Number.cpp")
                  sample_input="3 4 1 -2"
                  expected_one="Sum: 4 + 2i"
                  expected_two="Difference: 2 + 6i"
                  ;;
                "./C++ Codes/Inventory_Tracker.cpp")
                  sample_input=" "
                  expected_one="Stock: 105"
                  expected_two="Unit Price: 8.5"
                  ;;
                "./C++ Codes/Class_Work_2.cpp")
                  sample_input=" "
                  expected_one="New balance: 800"
                  expected_two="New balance: 700"
                  ;;
                "./C++ Codes/Tuesday_HW.cpp")
                  sample_input=" "
                  expected_one="Constructing C"
                  expected_two="2"
                  ;;
                "./C++ Codes/Multiple_Inheritance_Tree_Problem.cpp")
                  sample_input="2"
                  expected_one="Class C: 4"
                  expected_two="Class D: 1"
                  ;;
                "./C++ Codes/Operator_Overloading.cpp")
                  sample_input=" "
                  expected_one="Subtraction: 4 , 5"
                  expected_two="Incremented n1: 2 , 6"
                  ;;
                "./C++ Codes/Exam_Question_1.cpp")
                  sample_input=" "
                  expected_one="Quantity in Stock: 10"
                  expected_two="Quantity in Stock: 5"
                  ;;
                "./C++ Codes/Default_Arguments.cpp")
                  sample_input=" "
                  expected_one="3"
                  expected_two="10.5"
                  ;;
                "./C++ Codes/Operator_Overloading_Examples.cpp")
                  sample_input=" "
                  expected_one="Addition: 13"
                  expected_two="Postfix object after operation: 6"
                  ;;
                "./C++ Codes/Sunday_Class2.cpp")
                  sample_input=" "
                  expected_one="1 2 3"
                  expected_two=""
                  ;;
                "./C++ Codes/Class_Code_5.cpp")
                  sample_input=" "
                  expected_one="A values (private, protected, public): 1, 2, 3"
                  expected_two="objB.z is public: 3"
                  ;;
                "./C++ Codes/Assaignment_1.cpp")
                  sample_input=" "
                  expected_one="Area: 15"
                  expected_two="Perimeter: 16"
                  ;;
                "./C++ Codes/Exam_Question_2.cpp")
                  sample_input=" "
                  expected_one="Balance: 4000"
                  expected_two="Transfer successful!"
                  ;;
                "./Note Codes/36. File IO in C++.cpp")
                  sample_input=" "
                  expected_one="Hello, File!"
                  expected_two=""
                  ;;
              esac

              if [ -n "$sample_input" ]; then
                sample_code=0
                sample_output=$(printf '%s\n' "$sample_input" | timeout 3s "$binary" 2>&1) || sample_code=$?
                if [ "$sample_code" -eq 0 ] && printf '%s' "$sample_output" | grep -Fq "$expected_one" && printf '%s' "$sample_output" | grep -Fq "$expected_two"; then
                  sample_passed=$((sample_passed + 1))
                  printf 'SAMPLE_PASS\t%s\tprovided sample input; expected output checks passed\n' "$file" >> /tmp/cpp-audit/results.tsv
                else
                  sample_failed=$((sample_failed + 1))
                  printf 'SAMPLE_FAIL\t%s\tprovided sample input; expected output checks failed (exit=%s)\n' "$file" "$sample_code" >> /tmp/cpp-audit/results.tsv
                  printf '%s\n' "$sample_output" > "/tmp/cpp-audit/$safe_name.sample.log"
                fi
              fi

              if [ -n "$sample_input" ]; then
                : # The provided-input test above is authoritative for this selected example.
              elif [ "$code" -eq 0 ]; then
                ran=$((ran + 1))
                printf 'PASS\t%s\tcompiled and exited 0 with stdin closed\n' "$file" >> /tmp/cpp-audit/results.tsv
              elif [ "$code" -eq 124 ]; then
                timed_out=$((timed_out + 1))
                printf 'REVIEW\t%s\tcompiled but exceeded 3 seconds with stdin closed; inspect whether it expects input or loops\n' "$file" >> /tmp/cpp-audit/results.tsv
              else
                runtime_nonzero=$((runtime_nonzero + 1))
                printf 'REVIEW\t%s\tcompiled but exited with status %s when stdin was closed; inspect runtime log\n' "$file" "$code" >> /tmp/cpp-audit/results.tsv
              fi
            else
              compile_failed=$((compile_failed + 1))
              printf 'COMPILE_FAIL\t%s\tsee compile log %s.compile.log\n' "$file" "$safe_name" >> /tmp/cpp-audit/results.tsv
            fi
          done < <(find . -type f -name '*.cpp' -not -path './.git/*' -print0)

          echo "## C++ audit summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source files discovered: $total" >> "$GITHUB_STEP_SUMMARY"
          echo "- Compiled successfully: $compiled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Compile failures: $compile_failed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exited 0 with stdin closed: $ran" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime review (non-zero exit): $runtime_nonzero" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime review (3-second timeout): $timed_out" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Per-file results" >> "$GITHUB_STEP_SUMMARY"
          echo 'See the uploaded cpp-audit-results artifact for full results and compiler/runtime logs.' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/cpp-audit/results.tsv >> "$GITHUB_STEP_SUMMARY"

          mkdir -p audit-results
          cp /tmp/cpp-audit/results.tsv audit-results/results.tsv
          cp /tmp/cpp-audit/*.compile.log /tmp/cpp-audit/*.run.log audit-results/ 2>/dev/null || true
          echo "AUDIT_TOTAL=$total" >> "$GITHUB_ENV"
          echo "AUDIT_COMPILED=$compiled" >> "$GITHUB_ENV"
          echo "AUDIT_COMPILE_FAILED=$compile_failed" >> "$GITHUB_ENV"

      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-audit-results
          path: audit-results/
          if-no-files-found: warn
